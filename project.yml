name: HeatLens
options:
  bundleIdPrefix: dev.heatlens
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
packages:
  HeatLensCore:
    path: .
targets:
  HeatLens:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - "Icon/**"
    dependencies:
      - package: HeatLensCore
        product: HeatLensCore
      # The heatlens CLI / MCP server ships at Contents/Helpers/heatlens: Contents/MacOS/heatlens
      # would replace the app's own HeatLens executable on a case-insensitive volume.
      - target: heatlens-cli
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.heatlens.HeatLens
        PRODUCT_NAME: HeatLens
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: YES
        MARKETING_VERSION: "2.0.0"
        CURRENT_PROJECT_VERSION: "7"
  # Named heatlens-cli, with its own module name, because "heatlens" and "HeatLens" share build
  # folders and a .swiftmodule on a case-insensitive volume. The product is still heatlens.
  heatlens-cli:
    type: tool
    platform: macOS
    sources:
      - path: Sources/heatlens
    dependencies:
      - package: HeatLensCore
        product: HeatLensCLI
    settings:
      base:
        PRODUCT_NAME: heatlens
        PRODUCT_MODULE_NAME: heatlens_cli
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES
