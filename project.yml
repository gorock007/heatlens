name: HeatLens
options:
  bundleIdPrefix: dev.heatlens
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
packages:
  HeatLensCore:
    path: .
targets:
  HeatLens:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - "Icon/**"
    dependencies:
      - package: HeatLensCore
        product: HeatLensCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.heatlens.HeatLens
        PRODUCT_NAME: HeatLens
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: YES
        MARKETING_VERSION: "1.0.1"
        CURRENT_PROJECT_VERSION: "2"
