<!doctype html>
<!-- Source for og.png (1200x630). Rendered locally with Playwright; not linked from the site
     and excluded from deployment by .vercelignore. Inline styles are fine here for that reason. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>HeatLens social card</title>
  <style>
    @font-face { font-family: "Instrument Sans"; font-weight: 400 700; src: url(fonts/instrument-sans-latin.woff2) format("woff2"); }
    @font-face { font-family: "Instrument Serif"; font-style: italic; src: url(fonts/instrument-serif-italic-latin.woff2) format("woff2"); }
    html, body { margin: 0; }
    body {
      position: relative; width: 1200px; height: 630px; overflow: hidden;
      background: #b8321a; color: #fffaf4;
      font-family: "Instrument Sans", system-ui, sans-serif; -webkit-font-smoothing: antialiased;
    }
    .hero-scene { position: absolute; inset: 0; width: 100%; height: 100%; }
    .shade { position: absolute; inset: 0; background: radial-gradient(ellipse 60% 60% at 50% 30%, #5a0f0840, transparent 90%); }
    .copy { position: relative; text-align: center; padding-top: 64px; }
    .brand { display: inline-flex; align-items: center; gap: 14px; font-size: 34px; font-weight: 700; letter-spacing: -.05em; color: #fff6ea; margin-bottom: 34px; }
    .brand img { width: 56px; height: 56px; filter: drop-shadow(0 4px 10px #4a0f0450); }
    h1 { margin: 0; font-size: 92px; font-weight: 500; line-height: 1; letter-spacing: -.06em; text-shadow: 0 3px 32px #5a0f0822; }
    h1 em { display: block; font-family: "Instrument Serif", serif; font-weight: 400; font-size: 1.28em; letter-spacing: -.03em; color: #fff0d4; }
    .meta { margin-top: 30px; font-size: 22px; color: #3a1208; }
  </style>
</head>
<body>
  <svg class="hero-scene" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMax slice" aria-hidden="true" focusable="false">
        <defs>
          <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#7a1a14"/>
            <stop offset=".22" stop-color="#b8321a"/>
            <stop offset=".45" stop-color="#e8632a"/>
            <stop offset=".64" stop-color="#ff9a45"/>
            <stop offset=".8" stop-color="#ffcb7d"/>
            <stop offset="1" stop-color="#ffe7bd"/>
          </linearGradient>
          <radialGradient id="sun" cx=".5" cy=".5" r=".5">
            <stop offset="0" stop-color="#fff6d6"/>
            <stop offset=".18" stop-color="#ffe3a0" stop-opacity=".95"/>
            <stop offset=".45" stop-color="#ffb35c" stop-opacity=".55"/>
            <stop offset="1" stop-color="#ff8a3d" stop-opacity="0"/>
          </radialGradient>
          <linearGradient id="far" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#ffb978"/>
            <stop offset="1" stop-color="#f0874b"/>
          </linearGradient>
          <linearGradient id="mid" x1="1" y1="0" x2=".2" y2="1">
            <stop offset="0" stop-color="#e9723d"/>
            <stop offset=".6" stop-color="#cf4d26"/>
            <stop offset="1" stop-color="#b53a1d"/>
          </linearGradient>
          <linearGradient id="near" x1="0" y1="0" x2=".3" y2="1">
            <stop offset="0" stop-color="#a8331b"/>
            <stop offset="1" stop-color="#7c2213"/>
          </linearGradient>
          <filter id="soft"><feGaussianBlur stdDeviation="8"/></filter>
          <filter id="softer"><feGaussianBlur stdDeviation="3"/></filter>
          <filter id="haze"><feGaussianBlur stdDeviation="14"/></filter>
        </defs>
        <rect width="1440" height="900" fill="url(#sky)"/>
        <g class="sun">
          <circle cx="720" cy="610" r="470" fill="url(#sun)"/>
          <circle cx="720" cy="610" r="92" fill="#fff4d2" opacity=".9" filter="url(#softer)"/>
        </g>
        <g class="shimmer" filter="url(#haze)" fill="#fff3d9">
          <ellipse cx="420" cy="560" rx="380" ry="10" opacity=".35"/>
          <ellipse cx="1040" cy="585" rx="420" ry="9" opacity=".3"/>
          <ellipse cx="720" cy="530" rx="520" ry="7" opacity=".25"/>
        </g>
        <path fill="url(#far)" opacity=".9" filter="url(#soft)" d="M0 640 110 590 220 612 330 566 430 598 540 556 640 584 720 560 810 590 910 552 1010 586 1120 548 1230 584 1330 556 1440 580V900H0z"/>
        <path fill="url(#mid)" filter="url(#softer)" d="M0 700C120 668 210 640 320 652S520 700 640 690 860 640 980 646 1220 690 1440 664V900H0z"/>
        <path fill="url(#near)" d="M0 772C160 742 300 726 470 738S760 790 930 780 1250 730 1440 748V900H0z"/>
      </svg>
  <div class="shade"></div>
  <div class="copy">
    <div class="brand"><img src="icon-128.png" alt="">HeatLens</div>
    <h1>Why is my Mac<em>running hot?</em></h1>
    <p class="meta">Free menu-bar app for Apple Silicon · offline, read-only, open source</p>
  </div>
</body>
</html>
